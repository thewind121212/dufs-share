# =============================================================================
# Place at NPM container: /data/nginx/custom/http_top.conf
# Reload: docker exec <npm-container> nginx -s reload
# =============================================================================

# -----------------------------------------------------------------------------
# REQUEST-RATE ZONES (loose, tuned for static-asset page loads)
# -----------------------------------------------------------------------------
# 60 r/s + burst 200 → normal browsing (many parallel asset GETs) passes,
# scrapers/DoS get throttled.
limit_req_zone  $binary_remote_addr  zone=dufs_default:10m  rate=60r/s;
limit_req_zone  $binary_remote_addr  zone=dufs_trusted:10m  rate=600r/s;

# -----------------------------------------------------------------------------
# CONNECTION + BANDWIDTH ZONES (per-IP saturation defense)
# -----------------------------------------------------------------------------
# Cap concurrent conns per IP and per-conn bandwidth, so one IP can't drain pipe.
limit_conn_zone $binary_remote_addr  zone=dufs_conn:10m;

# Per-IP per-connection bandwidth cap. 5 MB/s/conn × 20 conn = 100 MB/s peak.
# Trusted IPs/origins get higher cap via $bw_cap below.
map $effective_zone $bw_cap {
    default              5m;     # 5 MB/s per connection — most users
    "dufs_trusted"       50m;    # 50 MB/s — trusted (your apps, office)
}

# -----------------------------------------------------------------------------
# CORS — allowed origins (EDIT THIS LIST)
# -----------------------------------------------------------------------------
map $http_origin $cors_origin {
    default                              "";

    # === EDIT BELOW ===
    "https://app.example.com"            $http_origin;
    "https://admin.example.com"          $http_origin;
    "http://localhost:3000"              $http_origin;
    "http://localhost:5173"              $http_origin;
    # === END EDIT ===
}

# -----------------------------------------------------------------------------
# RATE-LIMIT ZONE SELECTION (Origin-based)
# -----------------------------------------------------------------------------
# Trusted Origin → trusted zone (600r/s + 50 MB/s).
# Origin header is browser-supplied — fine for UX, NOT for AUTHZ.
map $http_origin $rate_limit_zone {
    default                              "dufs_default";

    # === EDIT BELOW (mirror cors_origin for trusted apps) ===
    "https://app.example.com"            "dufs_trusted";
    "https://admin.example.com"          "dufs_trusted";
    # === END EDIT ===
}

# -----------------------------------------------------------------------------
# IP allowlist (cryptographically stronger than Origin)
# -----------------------------------------------------------------------------
geo $rate_limit_skip {
    default                              0;

    # === EDIT BELOW ===
    # 203.0.113.0/24                     1;
    # 198.51.100.42                      1;
    # === END EDIT ===
}

# -----------------------------------------------------------------------------
# Combine: IP allowlist forces trusted, else use Origin choice
# -----------------------------------------------------------------------------
map "$rate_limit_skip:$rate_limit_zone" $effective_zone {
    "1:dufs_default"                     "dufs_trusted";
    "1:dufs_trusted"                     "dufs_trusted";
    default                              $rate_limit_zone;
}

# -----------------------------------------------------------------------------
# Connection cap per IP (Origin-aware)
# -----------------------------------------------------------------------------
map $effective_zone $conn_cap {
    default              20;     # 20 parallel conns
    "dufs_trusted"       100;    # 100 parallel for trusted
}

# -----------------------------------------------------------------------------
# Preflight detection
# -----------------------------------------------------------------------------
map $request_method $is_preflight {
    default                              0;
    OPTIONS                              1;
}
