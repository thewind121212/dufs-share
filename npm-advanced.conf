# =============================================================================
# Paste into NPM dashboard → Proxy Host → Advanced tab
# Requires npm-http-custom.conf installed at /data/nginx/custom/http_top.conf
# =============================================================================

# -----------------------------------------------------------------------------
# Verb whitelist — only read methods reach dufs
# -----------------------------------------------------------------------------
if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
    return 405;
}

# -----------------------------------------------------------------------------
# Hide WebDAV / framework discovery
# -----------------------------------------------------------------------------
proxy_hide_header Dav;
proxy_hide_header Allow;
proxy_hide_header Server;
proxy_hide_header X-Powered-By;

# -----------------------------------------------------------------------------
# Security headers
# -----------------------------------------------------------------------------
add_header Strict-Transport-Security  "max-age=63072000; includeSubDomains; preload" always;
add_header X-Content-Type-Options     "nosniff"                                       always;
add_header X-Frame-Options            "DENY"                                          always;
add_header Referrer-Policy            "no-referrer"                                   always;
add_header Permissions-Policy         "interest-cohort=()"                            always;

# -----------------------------------------------------------------------------
# CORS
# -----------------------------------------------------------------------------
add_header Access-Control-Allow-Origin       $cors_origin                              always;
add_header Access-Control-Allow-Methods      "GET, HEAD, OPTIONS"                      always;
add_header Access-Control-Allow-Headers      "Authorization, Content-Type, Range"      always;
add_header Access-Control-Expose-Headers     "Content-Length, Content-Range"           always;
add_header Access-Control-Max-Age            "86400"                                   always;
add_header Vary                              "Origin"                                  always;

if ($is_preflight) {
    return 204;
}

# -----------------------------------------------------------------------------
# Rate limit (loose, page-load friendly)
# -----------------------------------------------------------------------------
limit_req       zone=$effective_zone  burst=200  nodelay;
limit_req_status 429;

# -----------------------------------------------------------------------------
# Connection + bandwidth cap (anti-saturation)
# -----------------------------------------------------------------------------
limit_conn       dufs_conn  $conn_cap;
limit_conn_status 429;
limit_rate        $bw_cap;
limit_rate_after  2m;     # first 2 MB full speed → small files unaffected

# -----------------------------------------------------------------------------
# Custom 429 JSON body
# -----------------------------------------------------------------------------
error_page 429 = @rate_limited;

location @rate_limited {
    add_header Content-Type "application/json" always;
    return 429 '{"error":"rate_limited","message":"Too many requests or too much bandwidth. Try again later."}';
}

# -----------------------------------------------------------------------------
# Upload / streaming sizing
# -----------------------------------------------------------------------------
client_max_body_size 5G;
proxy_request_buffering off;
proxy_buffering off;
proxy_read_timeout 1h;
proxy_send_timeout 1h;
